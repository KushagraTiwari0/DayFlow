<!-- DASHBOARD PAGE (Integrated) -->
<div class="page active" id="page-planner">
    <main class="max-w-7xl mx-auto px-container-padding">
            <div class="mb-8 mt-4 text-center md:text-left">
                <h2 class="font-headline-lg-mobile md:font-headline-lg text-primary mb-2">Your Day at a Glance</h2>
                <p class="font-body-md text-on-surface-variant" id="dashboard-date">Today</p>
            </div>

            <!-- Bento Grid for Sticky Notes -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-card-gap items-start">
                
                <!-- Priorities Note (Warm Yellow) -->
                <div class="sticky-card bg-tertiary-fixed rounded-lg p-6 transform -rotate-1 cursor-pointer">
                    <div class="sticky-tape -rotate-3"></div>
                    <div class="flex items-center justify-between mb-4 border-b border-outline-variant/30 pb-2">
                        <h3 class="font-headline-md text-on-tertiary-fixed flex items-center gap-2">
                            <span class="material-symbols-outlined">star</span> Priorities
                        </h3>
                    </div>
                    <div class="space-y-4">
                        <label class="flex items-start gap-3 cursor-pointer group">
                            <div class="relative pt-1">
                                <input type="checkbox" class="checkbox-input sr-only" checked />
                                <div class="w-5 h-5 border-2 border-primary rounded-sm flex items-center justify-center bg-transparent group-hover:bg-primary/5 transition-colors checkbox-custom">
                                    <svg viewBox="0 0 24 24" class="w-4 h-4 text-primary absolute pointer-events-none" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12" class="hand-drawn-check"></polyline></svg>
                                </div>
                            </div>
                            <span class="font-body-md text-on-tertiary-fixed-variant strikethrough-animated strikethrough-active">Finalize Strategy</span>
                        </label>
                        <label class="flex items-start gap-3 cursor-pointer group">
                            <div class="relative pt-1">
                                <input type="checkbox" class="checkbox-input sr-only" />
                                <div class="w-5 h-5 border-2 border-primary rounded-sm flex items-center justify-center bg-transparent group-hover:bg-primary/5 transition-colors checkbox-custom">
                                    <svg viewBox="0 0 24 24" class="w-4 h-4 text-primary absolute pointer-events-none" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12" class="hand-drawn-check"></polyline></svg>
                                </div>
                            </div>
                            <span class="font-body-md text-on-tertiary-fixed-variant strikethrough-animated">Review mockups</span>
                        </label>
                    </div>
                </div>

                <!-- Tasks Note -->
                <div class="sticky-card bg-primary-fixed-dim/40 rounded-lg p-0 transform rotate-1 cursor-pointer overflow-hidden">
                    <div class="bg-primary-container h-10 w-full flex items-center justify-center space-x-2">
                        <div class="punch-hole"></div><div class="punch-hole"></div><div class="punch-hole"></div><div class="punch-hole"></div>
                    </div>
                    <div class="p-6">
                        <h3 class="font-headline-md text-primary mb-4 flex items-center gap-2">
                            <span class="material-symbols-outlined">check_circle</span> Tasks
                        </h3>
                        <ul class="font-body-md text-on-surface-variant space-y-3 list-disc list-inside">
                            <li>Reply to emails</li>
                            <li>Update staging server</li>
                            <li class="text-on-surface-variant/50 italic">Pick up dry cleaning</li>
                        </ul>
                    </div>
                </div>

                <!-- Meals Note -->
                <div class="sticky-card bg-secondary-fixed/50 rounded-lg p-6 transform -rotate-2 cursor-pointer md:col-span-2 lg:col-span-1">
                    <div class="sticky-tape rotate-2 bg-secondary-container/50"></div>
                    <h3 class="font-headline-md text-on-secondary-fixed mb-4 flex items-center gap-2">
                        <span class="material-symbols-outlined">restaurant</span> Meals
                    </h3>
                    <div class="space-y-4">
                        <div class="flex justify-between items-center border-b border-secondary/20 pb-2">
                            <span class="font-label-md text-secondary">BREAKFAST</span>
                            <span class="font-body-sm text-on-secondary-fixed-variant">Oatmeal</span>
                        </div>
                        <div class="flex justify-between items-center border-b border-secondary/20 pb-2">
                            <span class="font-label-md text-secondary">LUNCH</span>
                            <span class="font-body-sm text-on-secondary-fixed-variant opacity-50 italic">Not logged</span>
                        </div>
                    </div>
                </div>

            </div>
        </main>
</div>
