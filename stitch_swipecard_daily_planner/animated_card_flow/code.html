<span>Next</span>

<script>
        document.addEventListener('DOMContentLoaded', () => {
            const cards = document.querySelectorAll('article');
            const dotsContainer = document.getElementById('progressDots');
            const mainActionBtn = document.getElementById('mainActionBtn');
            const skipBtn = document.getElementById('skipBtn');
            const waterGlasses = document.querySelectorAll('.water-glass');
            const waterCountText = document.getElementById('waterCount');
            const cardContainer = document.getElementById('cardContainer');
            
            let currentIndex = 0;
            const totalCards = cards.length;

            // Initialize Dots
            const updateDots = () => {
                const dots = dotsContainer.children;
                for (let i = 0; i < dots.length; i++) {
                    if (i === currentIndex) {
                        dots[i].classList.replace('bg-outline-variant', 'bg-primary');
                        dots[i].classList.add('w-4'); // expand active dot slightly
                    } else {
                        dots[i].classList.replace('bg-primary', 'bg-outline-variant');
                        dots[i].classList.remove('w-4');
                    }
                }
            };

            // Update UI based on index
            const updateUI = () => {
                cards.forEach((card, index) => {
                    // Reset classes
                    card.classList.remove('card-active', 'card-enter', 'card-exit');
                    
                    if (index === currentIndex) {
                        card.classList.add('card-active');
                    } else if (index < currentIndex) {
                        card.classList.add('card-exit');
                    } else {
                        card.classList.add('card-enter');
                    }
                });

                updateDots();

                if (currentIndex === totalCards - 1) {
                    mainActionBtn.innerHTML = `<span>See My Day</span><span class="material-symbols-outlined text-[18px]">done</span>`;
                    mainActionBtn.classList.replace('bg-primary', 'bg-secondary');
                    mainActionBtn.classList.replace('text-on-primary', 'text-on-secondary');
                    if (mainActionBtn.classList.contains('hover:bg-surface-tint')) {
                        mainActionBtn.classList.replace('hover:bg-surface-tint', 'hover:bg-secondary-container');
                    }
                    skipBtn.style.opacity = '0';
                    skipBtn.style.pointerEvents = 'none';
                } else {
                    mainActionBtn.innerHTML = `<span>Next</span><span class="material-symbols-outlined text-[18px]">arrow_forward</span>`;
                    if (mainActionBtn.classList.contains('bg-secondary')) {
                        mainActionBtn.classList.replace('bg-secondary', 'bg-primary');
                        mainActionBtn.classList.replace('text-on-secondary', 'text-on-primary');
                        mainActionBtn.classList.replace('hover:bg-secondary-container', 'hover:bg-surface-tint');
                    }
                    skipBtn.style.opacity = '1';
                    skipBtn.style.pointerEvents = 'auto';
                }
            };

            // Swipe Handlers
            let touchStartX = 0;
            let touchEndX = 0;

            const handleSwipe = () => {
                const swipeThreshold = 50;
                if (touchStartX - touchEndX > swipeThreshold) {
                    // Swipe Left (Next)
                    if (currentIndex < totalCards - 1) {
                        currentIndex++;
                        updateUI();
                    }
                } else if (touchEndX - touchStartX > swipeThreshold) {
                    // Swipe Right (Previous)
                    if (currentIndex > 0) {
                        currentIndex--;
                        updateUI();
                    }
                }
            };

            cardContainer.addEventListener('touchstart', e => {
                touchStartX = e.changedTouches[0].screenX;
            }, { passive: true });

            cardContainer.addEventListener('touchend', e => {
                touchEndX = e.changedTouches[0].screenX;
                handleSwipe();
            }, { passive: true });

            // Navigation Handlers
            mainActionBtn.addEventListener('click', () => {
                if (currentIndex < totalCards - 1) {
                    currentIndex++;
                    updateUI();
                } else {
                    // Logic to finish flow (e.g., redirect)
                    console.log('Flow Complete - Redirecting to Dashboard');
                    // Add a tactile success pulse
                    mainActionBtn.classList.add('scale-90');
                    setTimeout(() => mainActionBtn.classList.remove('scale-90'), 150);
                }
            });

            skipBtn.addEventListener('click', () => {
                currentIndex = totalCards - 1; // Jump to last
                updateUI();
            });

            // Water Tracker Logic
            let filledCount = 0;
            waterGlasses.forEach(glass => {
                glass.addEventListener('click', function() {
                    const icon = this.querySelector('span');
                    if (icon.classList.contains('icon-fill')) {
                        icon.classList.remove('icon-fill', 'text-inverse-primary');
                        icon.classList.add('text-outline-variant');
                        filledCount = Math.max(0, filledCount - 1);
                    } else {
                        icon.classList.add('icon-fill', 'text-inverse-primary');
                        icon.classList.remove('text-outline-variant');
                        filledCount = Math.min(8, filledCount + 1);
                    }
                    waterCountText.textContent = `${filledCount} / 8 Glasses`;
                });
            });

            // Initial setup
            updateUI();
        });
    </script>
